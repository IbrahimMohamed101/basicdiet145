name: Subscription Stacking Atomic Skip

on:
  push:
    branches:
      - feat/subscription-stacking-phase-0-1-20260806
    paths:
      - "src/index.js"
      - "src/models/SubscriptionEntitlement*.js"
      - "src/services/installSubscriptionStackingSkipRouter.js"
      - "src/services/installSubscriptionStackingUnsupportedActionGuards.js"
      - "src/services/subscription/subscriptionStackingSkip*.js"
      - "src/services/subscription/subscriptionStackingCompensationService.js"
      - "src/services/subscription/subscriptionStackingFulfillmentLedgerService.js"
      - "tests/subscriptionStackingSkip*.test.js"
      - "tests/subscriptionStackingCompensationService.test.js"
      - "tests/subscriptionStackingFulfillmentLedger.test.js"
      - ".github/workflows/subscription-stacking-skip.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/index.js"
      - "src/models/SubscriptionEntitlement*.js"
      - "src/services/installSubscriptionStackingSkipRouter.js"
      - "src/services/installSubscriptionStackingUnsupportedActionGuards.js"
      - "src/services/subscription/subscriptionStackingSkip*.js"
      - "src/services/subscription/subscriptionStackingCompensationService.js"
      - "src/services/subscription/subscriptionStackingFulfillmentLedgerService.js"
      - "tests/subscriptionStackingSkip*.test.js"
      - "tests/subscriptionStackingCompensationService.test.js"
      - "tests/subscriptionStackingFulfillmentLedger.test.js"
      - ".github/workflows/subscription-stacking-skip.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: subscription-stacking-atomic-skip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  atomic-skip-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Atomic skip domain contracts
        run: NODE_ENV=test node tests/subscriptionStackingSkipService.test.js

      - name: Default-closed skip router contracts
        run: NODE_ENV=test node tests/subscriptionStackingSkipRouter.test.js

      - name: Per-batch compensation contracts
        run: NODE_ENV=test node tests/subscriptionStackingCompensationService.test.js

      - name: Fulfillment release and reopen contracts
        run: NODE_ENV=test node tests/subscriptionStackingFulfillmentLedger.test.js

      - name: Unsupported action guard regression
        run: NODE_ENV=test node tests/subscriptionStackingUnsupportedActionGuards.test.js

      - name: Current subscription regression gate
        run: npm run test:current-subscription

      - name: Subscription lifecycle regression gate
        run: npm run test:subscriptions
