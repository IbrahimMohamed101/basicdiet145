name: POS Stage F Staging Financial Validation
on:
  pull_request:
    branches:
      - codex/pos-staging-isolation
      - codex/pos-f-operations-safety-staging-20261107
  push:
    branches:
      - codex/pos-staging-isolation

permissions:
  contents: read

concurrency:
  group: pos-stage-f-${{ github.ref }}
  cancel-in-progress: false

jobs:
  invoice-refund:
    name: D-088..D-090 unit math and Mongo replica integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Parse new POS financial modules
        run: |
          node --check src/services/pos/invoiceMath.js
          node --check src/services/pos/financialQuoteService.js
          node --check src/services/pos/financialIntent.js
          node --check src/services/pos/financialRuntime.js
          node --check src/models/PosOperation.js
          node --check src/services/pos/operationService.js
          node --check src/services/pos/financialLedgerService.js
          node --check src/routes/dashboardPosFinancial.js
      - name: Seven approved VAT vectors and financial intent/property tests
        run: |
          NODE_ENV=test node --test tests/posInvoiceMath.test.js tests/posFinancialQuote.test.js tests/posStageFGuards.test.js
      - name: POS Staging isolation and catalog safety
        run: |
          NODE_ENV=test node --test tests/posStagingRuntime.test.js tests/posQuote.test.js tests/posCatalogHistory.test.js
      - name: Start isolated MongoDB replica set
        run: bash scripts/ci/start-mongo-replset.sh pos-stage-f-ci-mongo
      - name: Transactional invoice/refund concurrency and idempotency
        env:
          NODE_ENV: test
          MONGO_URI_TEST: mongodb://127.0.0.1:27017/basicdiet_pos_stage_f_ci_test?replicaSet=rs0
        run: |
          node -r ./tests/helpers/installMongoTestSafetyGuard.js --test tests/posStageF.integration.test.js
