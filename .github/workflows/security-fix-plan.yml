name: Temporary read-only dependency remediation plan

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/security-fix-plan.yml"

permissions:
  contents: read

jobs:
  generate-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/subscription-weekly-menu-20261016'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Check Firebase references and available patched versions
        shell: bash
        run: |
          set -euo pipefail
          echo "FIREBASE_IMPORT_REFERENCES_BEGIN"
          git grep -n -E 'getFirebaseAdmin|firebase-admin|utils/firebase|firebase\.js' -- src scripts tests || true
          echo "FIREBASE_IMPORT_REFERENCES_END"
          for name in multer nodemailer firebase-admin proxy-addr @fastify/busboy @grpc/grpc-js; do
            echo "NPM_VERSION_LOOKUP_START $name"
            npm view "$name" version engines --json || true
            echo "NPM_VERSION_LOOKUP_END $name"
          done
      - name: Plan Node 20 dependency updates in an isolated checkout
        shell: bash
        run: |
          set -euo pipefail
          npm uninstall --package-lock-only --ignore-scripts --no-audit --no-fund firebase-admin
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund multer@latest nodemailer@latest
          set +e
          npm audit fix --package-lock-only --ignore-scripts --no-fund
          code=$?
          set -e
          echo "AUDIT_FIX_EXIT_CODE=$code"
          npm ci --ignore-scripts --no-audit --no-fund
          set +e
          npm audit --omit=dev --json > /tmp/security-audit.json
          audit_code=$?
          set -e
          echo "PRODUCTION_AUDIT_EXIT_CODE=$audit_code"
          node -e 'const a=require("/tmp/security-audit.json");console.log("AUDIT_RESULT="+JSON.stringify({severity:a.metadata?.vulnerabilities,blocked:Object.entries(a.vulnerabilities||{}).filter(([,v])=>["high","critical"].includes(v.severity)).map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable}))}));'
          node -e 'const p=require("./package.json");console.log("UPDATED_DIRECT_DEPS="+JSON.stringify({firebaseAdmin:p.dependencies["firebase-admin"],multer:p.dependencies.multer,nodemailer:p.dependencies.nodemailer}));'
