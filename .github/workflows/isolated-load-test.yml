name: Temporary isolated load test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: isolated-load-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  TZ: Asia/Riyadh
  JWT_SECRET: temporary-load-test-jwt-secret
  DASHBOARD_JWT_SECRET: temporary-load-test-dashboard-secret
  SUBSCRIPTION_AUTO_SETTLEMENT_ENABLED: "false"
  DASHBOARD_UNCONSUMED_MEAL_BALANCE_ENABLED: "true"
  CLIENT_UNCONSUMED_MEAL_BALANCE_ENABLED: "true"
  SUBSCRIPTION_WEEKLY_PLANNING_WINDOW_ENABLED: "true"
  MONGO_URI: ""
  MONGODB_URI: ""
  MONGO_URI_TEST: ""
  DATABASE_URL: ""

jobs:
  fulfillment-concurrency-load:
    name: Fulfillment concurrency load
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Warm MongoMemory binary and test
        run: node tests/subscriptionFulfillmentConcurrency.test.js
      - name: Run 12 isolated concurrency scenarios with 4 workers
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          seq 1 12 | xargs -P4 -I{} bash -lc '
            echo "fulfillment scenario {} starting"
            node tests/subscriptionFulfillmentConcurrency.test.js
            echo "fulfillment scenario {} passed"
          '
          end=$(date +%s)
          duration=$((end-start))
          {
            echo "## Fulfillment concurrency load"
            echo "- Isolated scenarios: 12"
            echo "- Parallel workers: 4"
            echo "- Concurrent fulfill calls per scenario: 5"
            echo "- Total fulfill invocations exercised: 60"
            echo "- Duration: ${duration}s"
          } >> "$GITHUB_STEP_SUMMARY"

  checkout-idempotency-load:
    name: Checkout idempotency load
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Warm MongoMemory binary and test
        run: node tests/subscriptionCheckoutInvoiceConcurrency.test.js
      - name: Run 9 isolated checkout scenarios with 3 workers
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          seq 1 9 | xargs -P3 -I{} bash -lc '
            echo "checkout scenario {} starting"
            node tests/subscriptionCheckoutInvoiceConcurrency.test.js
            echo "checkout scenario {} passed"
          '
          end=$(date +%s)
          duration=$((end-start))
          {
            echo "## Checkout idempotency load"
            echo "- Isolated scenarios: 9"
            echo "- Parallel workers: 3"
            echo "- Concurrent invoice callers per scenario: 20"
            echo "- Concurrent payment persistence callers per scenario: 20"
            echo "- Total high-contention calls exercised: 360"
            echo "- Duration: ${duration}s"
          } >> "$GITHUB_STEP_SUMMARY"

  http-lifecycle-soak:
    name: HTTP lifecycle soak
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Warm HTTP lifecycle matrix
        run: node tests/subscriptionWeeklyPlanningWindowHttpMatrix.integration.test.js
      - name: Run HTTP and client-balance soak scenarios
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          seq 1 6 | xargs -P2 -I{} bash -lc '
            echo "weekly HTTP scenario {} starting"
            node tests/subscriptionWeeklyPlanningWindowHttpMatrix.integration.test.js
            echo "weekly HTTP scenario {} passed"
          '
          seq 1 4 | xargs -P2 -I{} bash -lc '
            echo "client balance scenario {} starting"
            node tests/subscriptionClientMealBalance.integration.test.js
            echo "client balance scenario {} passed"
          '
          end=$(date +%s)
          duration=$((end-start))
          {
            echo "## HTTP lifecycle soak"
            echo "- Weekly HTTP matrix runs: 6"
            echo "- Client balance lifecycle runs: 4"
            echo "- Parallel workers: 2"
            echo "- Duration: ${duration}s"
          } >> "$GITHUB_STEP_SUMMARY"

  load-test-summary:
    name: Isolated load test summary
    runs-on: ubuntu-latest
    needs:
      - fulfillment-concurrency-load
      - checkout-idempotency-load
      - http-lifecycle-soak
    steps:
      - name: Confirm all isolated load jobs passed
        run: |
          echo "All isolated load-test jobs completed successfully."
          echo "No Production, Staging, Railway, or remote MongoDB resources were used." >> "$GITHUB_STEP_SUMMARY"
