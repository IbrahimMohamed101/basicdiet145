name: Subscription Stacking Extra Selection P3

on:
  push:
    branches:
      - feat/stacking-premium-addon-selection-p3-20260812
  pull_request:
    branches:
      - feat/stacking-premium-addon-activation-p2-20260812
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: subscription-stacking-extra-selection-p3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transactional-extra-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax
        run: |
          node --check src/index.js
          node --check src/models/SubscriptionDay.js
          node --check src/services/fulfillmentService.js
          node --check src/services/subscription/subscriptionCancellationService.js
          node --check src/services/subscription/subscriptionClientSupportService.js
          node --check src/services/subscription/subscriptionStackingExtraSelectionAuthorityService.js
          node --check src/services/subscription/subscriptionStackingExtraSelectionLifecycleService.js
          node --check src/services/subscription/subscriptionStackingReadService.js
          node --check src/services/subscription/subscriptionStackingSelectionWriteService.js
          node --check src/services/subscription/subscriptionStackingSelectionRouterService.js
          node --check src/services/subscription/subscriptionStackingRolloutPolicyService.js
          node --check src/services/subscription/subscriptionStackingProductionSafetyService.js
          node --check src/services/subscription/subscriptionStackingSkipService.js
          node --check tests/subscriptionStackingExtraSelectionP3.integration.test.js
          node --check tests/subscriptionStackingExtraSelectionP3Contracts.test.js

      - name: P3 transactional selection integration
        run: NODE_ENV=test node tests/subscriptionStackingExtraSelectionP3.integration.test.js

      - name: P3 canary and client contracts
        run: NODE_ENV=test node tests/subscriptionStackingExtraSelectionP3Contracts.test.js

      - name: P2 activation regression
        run: NODE_ENV=test node tests/subscriptionStackingExtraActivationP2.integration.test.js

      - name: P1 allocation regression
        run: NODE_ENV=test node tests/subscriptionExtraEntitlementAllocationLifecycle.test.js

      - name: P0 wallet regression
        run: NODE_ENV=test node tests/subscriptionExtraEntitlementBucket.test.js

      - name: Base activation and planner regressions
        run: |
          NODE_ENV=test node tests/subscriptionStackingActivationService.test.js
          NODE_ENV=test node tests/subscriptionStackingPlanningContext.test.js
          NODE_ENV=test node tests/subscriptionStackingSelectionRouter.test.js
          NODE_ENV=test node tests/subscriptionStackingSelectionWriteGuards.test.js

      - name: Skip and cancellation release regressions
        run: |
          NODE_ENV=test node tests/subscriptionStackingSkipService.test.js
          NODE_ENV=test node tests/subscriptionCancellationBalancePolicy.test.js
          npx jest --runInBand tests/services/subscription/subscriptionCancellationService.concurrency.test.js

      - name: Legacy Premium and Add-on lifecycle regressions
        run: |
          NODE_ENV=test node tests/premiumBaseMealCreditLifecycle.integration.test.js
          NODE_ENV=test node tests/addonBalanceReleaseIdempotency.test.js
          NODE_ENV=test node tests/subscriptionDailyAddonReservationLifecycle.test.js
          NODE_ENV=test node tests/subscriptionDailyAddonReopen.test.js

      - name: Payment idempotency and race regression
        run: NODE_ENV=test node tests/subscriptionStackingConcurrentPurchases.integration.test.js

      - name: Production kill switch and explicit canary only
        shell: bash
        run: |
          grep -q 'SUBSCRIPTION_STACKING_PRODUCTION_EXTRA_SELECTION_BLOCKED' src/services/subscription/subscriptionStackingProductionSafetyService.js
          grep -q 'STACKING_EXTRA_SELECTION_WILDCARD_BLOCKED' src/services/subscription/subscriptionStackingRolloutPolicyService.js
          grep -q 'STACKING_PREMIUM_SELECTION_NOT_READY' src/services/subscription/subscriptionStackingSelectionWriteService.js
          grep -q 'STACKING_ADDON_SELECTION_NOT_READY' src/services/subscription/subscriptionStackingSelectionWriteService.js
          if grep -q 'SUBSCRIPTION_STACKING_ALLOW_ALL_USERS' \
            src/services/subscription/subscriptionStackingExtraSelectionAuthorityService.js \
            src/services/subscription/subscriptionStackingExtraSelectionLifecycleService.js; then
            echo 'P3 extra selection services must not use allow-all rollout.' >&2
            exit 1
          fi
          NODE_ENV=test node tests/subscriptionStackingProductionSafety.test.js
          NODE_ENV=test node tests/subscriptionStackingRolloutPolicy.test.js

      - name: Runtime isolation and prohibited change audit
        shell: bash
        run: |
          base_ref="${{ github.base_ref }}"
          if [ -z "$base_ref" ]; then
            base_ref="feat/stacking-premium-addon-activation-p2-20260812"
          fi
          git fetch origin "$base_ref" --depth=1
          changed_files="$(git diff --name-only "origin/$base_ref"...HEAD)"
          if printf '%s\n' "$changed_files" | grep -E '(^|/)(flutter|dashboard)(/|$)'; then
            echo 'P3 must not change Flutter or Dashboard files.' >&2
            exit 1
          fi
          if git diff "origin/$base_ref"...HEAD -- src tests | grep -E 'mongodb(\+srv)?://|MOYASAR_[A-Z_]*[=:][[:space:]]*[^$]'; then
            echo 'Potential credential or Mongo URI found in P3 diff.' >&2
            exit 1
          fi
          if git diff "origin/$base_ref"...HEAD -- src tests | grep -E 'continue-on-error:|test[-_ ]only.*bypass'; then
            echo 'P3 diff contains a forbidden bypass pattern.' >&2
            exit 1
          fi

      - name: Full subscription suite
        run: npm run test:subscriptions

      - name: Diff whitespace check
        run: git diff --check
