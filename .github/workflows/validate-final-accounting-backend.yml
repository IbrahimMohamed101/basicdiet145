name: Validate final accounting backend

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/accounting-reports-final'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate syntax
        run: |
          node --check src/services/dashboard/subscriptionPaymentAccountingFacade.js
          node --check src/controllers/dashboard/subscriptionPaymentReportController.js
          node --check tests/subscriptionPaymentAccountingFacade.test.js
      - name: Run new accounting contract
        run: node tests/subscriptionPaymentAccountingFacade.test.js
      - name: Run existing presentation contract
        run: node tests/subscriptionPaymentReportPresentation.test.js
