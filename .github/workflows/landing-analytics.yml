name: Landing analytics security contracts
on:
  pull_request:
    paths:
      - "src/models/LandingAnalyticsEvent.js"
      - "src/services/landingAnalyticsService.js"
      - "src/routes/landingAnalytics.js"
      - "tests/landingAnalytics.test.js"
      - "package.json"
      - ".github/workflows/landing-analytics.yml"
  push:
    branches: [main]
    paths:
      - "src/models/LandingAnalyticsEvent.js"
      - "src/services/landingAnalyticsService.js"
      - "src/routes/landingAnalytics.js"
      - "tests/landingAnalytics.test.js"
      - "package.json"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:landing-analytics
