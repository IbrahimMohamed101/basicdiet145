name: Temporary balance baseline comparison

on:
  push:
    branches:
      - agent/weekly-planning-balance-phase-1
  pull_request:
    paths:
      - ".github/workflows/temporary-balance-baseline-comparison.yml"
      - "src/routes/index.js"
      - "src/middleware/dashboardSubscriptionMealBalanceProjection.js"
      - "src/services/subscription/subscriptionDashboardMealBalanceProjectionService.js"

permissions:
  contents: read

jobs:
  compare:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: main-delivery-slot
            ref: main
            command: node tests/dashboardDeliverySlotCompatibility.test.js
          - label: branch-delivery-slot
            ref: agent/weekly-planning-balance-phase-1
            command: node tests/dashboardDeliverySlotCompatibility.test.js
          - label: main-addon-plan
            ref: main
            command: npm run test:dashboard-subscription-addon-plan-availability
          - label: branch-addon-plan
            ref: agent/weekly-planning-balance-phase-1
            command: npm run test:dashboard-subscription-addon-plan-availability
    env:
      NODE_ENV: test
      JWT_SECRET: baseline-comparison-test-secret
      DASHBOARD_JWT_SECRET: baseline-comparison-dashboard-secret

    steps:
      - name: Checkout ${{ matrix.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --silent

      - name: Run exact comparison command
        run: ${{ matrix.command }}
