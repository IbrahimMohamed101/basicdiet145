name: Debug full meal contract

on:
  pull_request:
    paths:
      - "tests/mealPlannerFullMealProductContract.test.js"
      - ".github/workflows/debug-full-meal-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run focused contract
        id: contract
        continue-on-error: true
        run: |
          set +e
          NODE_ENV=test node tests/mealPlannerFullMealProductContract.test.js > full-meal-contract.log 2>&1
          code=$?
          echo "$code" > full-meal-contract.exit
          exit $code
      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-meal-contract-diagnostics
          path: |
            full-meal-contract.log
            full-meal-contract.exit
          if-no-files-found: error
      - name: Enforce focused contract
        if: always()
        run: |
          code=$(cat full-meal-contract.exit)
          cat full-meal-contract.log
          exit "$code"
