name: Landing lead security contracts
on:
  pull_request:
    paths:
      - "src/models/LandingLead.js"
      - "src/models/LandingAnalyticsEvent.js"
      - "src/services/landingLeadService.js"
      - "src/services/landingAnalyticsService.js"
      - "src/routes/landingLeads.js"
      - "src/services/landingLeadConversionReadService.js"
      - "src/services/subscriptionAcquisitionReadService.js"
      - "src/services/subscription/subscriptionOperationsReadService.js"
      - "src/controllers/adminController.js"
      - "tests/landingLeads.test.js"
      - "tests/metaLandingConversions.test.js"
      - "src/services/metaLandingConversionsService.js"
      - "src/models/MetaLandingEvent.js"
      - "src/jobs/index.js"
      - "tests/landingLeadPersistence.test.js"
      - "tests/landingLeadConversion.test.js"
      - "package.json"
      - ".github/workflows/landing-leads.yml"
  push:
    branches: [main]
    paths:
      - "src/models/LandingLead.js"
      - "src/services/landingLeadService.js"
      - "src/routes/landingLeads.js"
      - "src/services/landingLeadConversionReadService.js"
      - "src/services/subscriptionAcquisitionReadService.js"
      - "src/services/subscription/subscriptionOperationsReadService.js"
      - "src/controllers/adminController.js"
      - "tests/landingLeads.test.js"
      - "tests/landingLeadPersistence.test.js"
      - "tests/landingLeadConversion.test.js"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:landing-leads
      - name: Meta CAPI consent and queue regression
        run: node tests/metaLandingConversions.test.js

      - name: Real lead persistence and dashboard read integration (ephemeral MongoDB)
        run: NODE_ENV=test node -r ./tests/helpers/installMongoTestSafetyGuard.js tests/landingLeadPersistence.test.js
