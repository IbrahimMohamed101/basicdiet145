name: Staging Remote Pending Checkout Probe

on:
  push:
    branches:
      - cert/staging-remote-20260810
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://basicdiet145-staging-2882.up.railway.app
      EXPECTED_DEPLOY_SHA: c6db595b3f55abd7c0717de4ce8cf22d226c101d
      CERT_USER_ID: 6a7b6006a86353ffc9f0f83b
      PURCHASE_PLAN_ID: 6a7b6006a86353ffc9f0f841
      SOURCE_RUN_ID: 31519244588
      SOURCE_RUN_ATTEMPT: 1
      CHECKOUT_IDEMPOTENCY_KEY: stacking-cert-acceptance-a-20260811-v1
    steps:
      - name: Public health gates
        shell: bash
        run: |
          set -euo pipefail
          for path in live ready health; do
            body="$(curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 "${BASE_URL}/${path}")"
            test "$(echo "$body" | jq -r '.status')" = "true"
          done

      - name: Login isolated staging certification user
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          tail="$(printf '%07d' $(((SOURCE_RUN_ID + SOURCE_RUN_ATTEMPT * 7919) % 10000000)))"
          phone="+96655${tail}"
          password="StagingCert!${SOURCE_RUN_ID}-${SOURCE_RUN_ATTEMPT}Aa9"
          echo "::add-mask::$password"
          payload="$(jq -nc --arg phone "$phone" --arg password "$password" '{phoneE164:$phone,password:$password}')"
          response="$(curl --fail-with-body --silent --show-error -X POST "${BASE_URL}/api/auth/login" -H 'Content-Type: application/json' --data "$payload")"
          token="$(echo "$response" | jq -r '.accessToken // empty')"
          user_id="$(echo "$response" | jq -r '.user.id // empty')"
          test -n "$token"
          test "$user_id" = "$CERT_USER_ID"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Remote write-readiness gate
        shell: bash
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error "${BASE_URL}/api/subscriptions/stacking/readiness" -H "Authorization: Bearer ${TOKEN}")"
          test "$(echo "$response" | jq -r '.data.environment.production')" = "false"
          test "$(echo "$response" | jq -r '.data.deployment.commitSha')" = "$EXPECTED_DEPLOY_SHA"
          test "$(echo "$response" | jq -r '.data.deployment.safetyAttestation.databaseIsolationConfirmed')" = "true"
          test "$(echo "$response" | jq -r '.data.deployment.safetyAttestation.writeSafe')" = "true"
          test "$(echo "$response" | jq -r '.data.rollout.shadowEnabledForUser')" = "true"
          test "$(echo "$response" | jq -r '.data.rollout.readEnabledForUser')" = "true"
          test "$(echo "$response" | jq -r '.data.rollout.writeEnabledForUser')" = "true"
          test "$(echo "$response" | jq -r '.data.rollout.singleUserCanary')" = "true"
          test "$(echo "$response" | jq -r '.data.rollout.allowAllUsers')" = "false"
          test "$(echo "$response" | jq -r '.data.certification.baseMealCanaryReady')" = "true"
          echo "REMOTE_WRITE_READINESS_GATE=PASS"

      - name: Quote additive base package
        shell: bash
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          payload="$(jq -nc \
            --arg planId "$PURCHASE_PLAN_ID" \
            '{planId:$planId,grams:150,mealsPerDay:2,startDate:"2026-08-12",premiumItems:[],addons:[],delivery:{type:"pickup"}}')"
          response="$(curl --fail-with-body --silent --show-error \
            -X POST "${BASE_URL}/api/subscriptions/quote" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "$payload")"
          echo "$response" | jq -e 'type == "object"' >/dev/null
          echo "ADDITIVE_QUOTE_GATE=PASS"

      - name: Create pending additive checkout
        id: checkout
        shell: bash
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          payload="$(jq -nc \
            --arg planId "$PURCHASE_PLAN_ID" \
            '{planId:$planId,grams:150,mealsPerDay:2,startDate:"2026-08-12",premiumItems:[],addons:[],delivery:{type:"pickup"}}')"
          response="$(curl --fail-with-body --silent --show-error \
            -X POST "${BASE_URL}/api/subscriptions/checkout" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Content-Type: application/json' \
            -H "Idempotency-Key: ${CHECKOUT_IDEMPOTENCY_KEY}" \
            --data "$payload")"

          draft_id="$(echo "$response" | jq -r '.data.draftId // empty')"
          payment_id="$(echo "$response" | jq -r '.data.paymentId // empty')"
          invoice_id="$(echo "$response" | jq -r '.data.invoice_id // empty')"
          subscription_id="$(echo "$response" | jq -r '.data.subscriptionId // empty')"
          total_halala="$(echo "$response" | jq -r '.data.totals.totalHalala // .data.pricingSummary.totalPriceHalala // empty')"

          test -n "$draft_id"
          test -n "$payment_id"
          test -n "$invoice_id"
          test -z "$subscription_id" -o "$subscription_id" = "null"
          test "$total_halala" = "10000"

          echo "draft_id=$draft_id" >> "$GITHUB_OUTPUT"
          echo "payment_id=$payment_id" >> "$GITHUB_OUTPUT"
          echo "PENDING_CHECKOUT_GATE=PASS"
          echo "draftId=$draft_id"
          echo "paymentId=$payment_id"
          echo "totalHalala=$total_halala"

      - name: Pending checkout remains non-activated
        shell: bash
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
          DRAFT_ID: ${{ steps.checkout.outputs.draft_id }}
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            "${BASE_URL}/api/subscriptions/checkout-drafts/${DRAFT_ID}" \
            -H "Authorization: Bearer ${TOKEN}")"
          status="$(echo "$response" | jq -r '.data.status // .status // empty')"
          subscription_id="$(echo "$response" | jq -r '.data.subscriptionId // empty')"
          test "$status" != "completed"
          test -z "$subscription_id" -o "$subscription_id" = "null"
          echo "PENDING_NOT_ACTIVATED_GATE=PASS"
