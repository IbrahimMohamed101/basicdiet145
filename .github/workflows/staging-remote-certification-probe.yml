name: Staging Remote Shadow Certification Probe

on:
  push:
    branches:
      - cert/staging-remote-20260810
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://basicdiet145-staging-2882.up.railway.app
      EXPECTED_DEPLOY_SHA: c6db595b3f55abd7c0717de4ce8cf22d226c101d
      CERT_USER_ID: 6a7b6006a86353ffc9f0f83b
      SOURCE_RUN_ID: 31519244588
      SOURCE_RUN_ATTEMPT: 1
    steps:
      - name: Public health gates
        shell: bash
        run: |
          set -euo pipefail
          for path in live ready health; do
            echo "== GET /${path} =="
            body="$(curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 "${BASE_URL}/${path}")"
            echo "$body" | jq .
            test "$(echo "$body" | jq -r '.status')" = "true"
          done

      - name: Login isolated staging certification user
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          tail="$(printf '%07d' $(((SOURCE_RUN_ID + SOURCE_RUN_ATTEMPT * 7919) % 10000000)))"
          phone="+96655${tail}"
          password="StagingCert!${SOURCE_RUN_ID}-${SOURCE_RUN_ATTEMPT}Aa9"
          echo "::add-mask::$password"
          payload="$(jq -nc --arg phone "$phone" --arg password "$password" '{phoneE164:$phone,password:$password}')"
          response="$(curl --fail-with-body --silent --show-error -X POST "${BASE_URL}/api/auth/login" -H 'Content-Type: application/json' --data "$payload")"
          token="$(echo "$response" | jq -r '.accessToken // empty')"
          user_id="$(echo "$response" | jq -r '.user.id // empty')"
          test -n "$token"
          test "$user_id" = "$CERT_USER_ID"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "Authenticated isolated staging user: $user_id"

      - name: Authenticated identity gate
        shell: bash
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error "${BASE_URL}/api/auth/me" -H "Authorization: Bearer ${TOKEN}")"
          echo "$response" | jq '{ok, user: (.user // .data // {})}'
          actual="$(echo "$response" | jq -r '(.user.id // .data.id // .data.user.id // empty)')"
          test "$actual" = "$CERT_USER_ID"

      - name: Remote shadow-only readiness gate
        shell: bash
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error "${BASE_URL}/api/subscriptions/stacking/readiness" -H "Authorization: Bearer ${TOKEN}")"
          echo "$response" | jq '.data'

          test "$(echo "$response" | jq -r '.data.contractVersion')" = "subscription_stacking_remote_readiness.v1"
          test "$(echo "$response" | jq -r '.data.environment.production')" = "false"
          test "$(echo "$response" | jq -r '.data.deployment.commitSha')" = "$EXPECTED_DEPLOY_SHA"
          test "$(echo "$response" | jq -r '.data.deployment.safetyAttestation.databaseIsolationConfirmed')" = "true"
          test "$(echo "$response" | jq -r '.data.deployment.safetyAttestation.databaseIdentityAvailable')" = "true"
          test "$(echo "$response" | jq -r '.data.deployment.safetyAttestation.readSafe')" = "true"
          test "$(echo "$response" | jq -r '.data.deployment.safetyAttestation.writeSafe')" = "true"

          test "$(echo "$response" | jq -r '.data.rollout.shadowEnabledGlobally')" = "true"
          test "$(echo "$response" | jq -r '.data.rollout.shadowEnabledForUser')" = "true"
          test "$(echo "$response" | jq -r '.data.rollout.readEnabledGlobally')" = "false"
          test "$(echo "$response" | jq -r '.data.rollout.readEnabledForUser')" = "false"
          test "$(echo "$response" | jq -r '.data.rollout.writeEnabledGlobally')" = "false"
          test "$(echo "$response" | jq -r '.data.rollout.writeEnabledForUser')" = "false"
          test "$(echo "$response" | jq -r '.data.rollout.singleUserCanary')" = "false"
          test "$(echo "$response" | jq -r '.data.rollout.allowAllUsers')" = "false"
          test "$(echo "$response" | jq -r '.data.rollout.wildcardConfigured')" = "false"
          test "$(echo "$response" | jq -r '.data.certification.readProbeReady')" = "false"
          test "$(echo "$response" | jq -r '.data.certification.baseMealCanaryReady')" = "false"

          test "$(echo "$response" | jq -r '.data.runtime.baseMealCheckoutSupported')" = "true"
          test "$(echo "$response" | jq -r '.data.runtime.premiumStackingSupported')" = "false"
          test "$(echo "$response" | jq -r '.data.runtime.addonStackingSupported')" = "false"
          test "$(echo "$response" | jq -r '.data.runtime.freezeSupported')" = "false"
          test "$(echo "$response" | jq -r '.data.runtime.cancellationSupported')" = "false"
          test "$(echo "$response" | jq -r '.data.runtime.directPickupSupported')" = "false"

          echo "REMOTE_SHADOW_GATE=PASS"
          echo "CERT_TEST_USER_ID=$CERT_USER_ID"
