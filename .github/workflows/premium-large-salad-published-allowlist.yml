name: Premium Large Salad published allowlist

on:
  push:
    branches:
      - agent/fix-premium-large-salad-published-allowlist
  pull_request:
    paths:
      - "src/services/installFlutterMealPlannerCatalogExpansion.js"
      - "src/services/installFlutterPremiumLargeSaladOptionGroups.js"
      - "src/services/installFlutterPublishedSelectionAuthority.js"
      - "tests/premiumLargeSaladPublishedCatalogDiagnostics.test.js"
      - "tests/premiumLargeSaladV3Allowlist.test.js"
      - ".github/workflows/premium-large-salad-published-allowlist.yml"

permissions:
  contents: write

jobs:
  published-allowlist:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      JWT_SECRET: premium-large-salad-allowlist-test-secret
      DASHBOARD_JWT_SECRET: premium-large-salad-allowlist-dashboard-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.sha }}

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --silent

      - name: Apply narrow source patch
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          python - <<'PY'
          from pathlib import Path

          expansion_path = Path("src/services/installFlutterMealPlannerCatalogExpansion.js")
          expansion = expansion_path.read_text()
          old_expansion = '''    if (DIRECT_SECTION_TYPES.has(token(descriptor.sectionType || descriptor.type))) {
              for (const product of directProductsFor(descriptor, context)) {
                const id = String(product._id);
                if (usedDirectIds.has(id)) continue;
                products.push(directProductPayload(product, descriptor, lang));
                usedDirectIds.add(id);
              }
              products = products.sort((left, right) =>
                Number(left.sortOrder || 0) - Number(right.sortOrder || 0)
              );
            }'''
          new_expansion = '''    if (DIRECT_SECTION_TYPES.has(token(descriptor.sectionType || descriptor.type))) {
              const sectionProductIds = new Set(
                products
                  .map((product) => String(product.id || product.productId || ""))
                  .filter(Boolean)
              );
              for (const product of directProductsFor(descriptor, context)) {
                const id = String(product._id);
                if (sectionProductIds.has(id) || usedDirectIds.has(id)) continue;
                products.push(directProductPayload(product, descriptor, lang));
                sectionProductIds.add(id);
                usedDirectIds.add(id);
              }
              products = products.sort((left, right) =>
                Number(left.sortOrder || 0) - Number(right.sortOrder || 0)
              );
            }'''
          if expansion.count(old_expansion) != 1:
              raise SystemExit("Expected exactly one direct-product expansion block")
          expansion_path.write_text(expansion.replace(old_expansion, new_expansion))

          test_path = Path("tests/premiumLargeSaladV3Allowlist.test.js")
          test = test_path.read_text()
          old_test = '''    const publishedSaladProduct = publishedPlannerCatalog.sections
              .flatMap((section) => section.products || [])
              .find((product) => product.key === "premium_large_salad");
            const publishedProteinGroup = publishedSaladProduct.optionGroups.find((group) => group.key === "proteins");
            assert.deepStrictEqual(
              publishedProteinGroup.options.map((option) => option.key),
              ["grilled_chicken"],
              "dashboard restrictions may narrow, but never widen, the subscription salad allowlist"
            );'''
          new_test = '''    const publishedSaladProducts = publishedPlannerCatalog.sections
              .flatMap((section) => section.products || [])
              .filter((product) => product.key === "premium_large_salad");
            assert.strictEqual(
              publishedSaladProducts.length,
              1,
              "published planner exposes Premium Large Salad exactly once"
            );
            const [publishedSaladProduct] = publishedSaladProducts;
            assert.strictEqual(
              publishedSaladProduct.selectionType,
              "premium_large_salad",
              "published Premium Large Salad keeps its canonical selection type"
            );
            const publishedProteinGroup = publishedSaladProduct.optionGroups.find(
              (group) => group.key === "protein"
            );
            assert(publishedProteinGroup, "published planner exposes the canonical protein group");
            assert.strictEqual(publishedProteinGroup.canonicalGroupKey, "protein");
            assert.strictEqual(publishedProteinGroup.sourceKey, "proteins");
            assert.deepStrictEqual(
              publishedProteinGroup.options.map((option) => option.key),
              ["grilled_chicken"],
              "dashboard restrictions may narrow, but never widen, the subscription salad allowlist"
            );'''
          if test.count(old_test) != 1:
              raise SystemExit("Expected exactly one stale published salad assertion block")
          test_path.write_text(test.replace(old_test, new_test))
          PY

      - name: Commit narrow source patch
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/installFlutterMealPlannerCatalogExpansion.js tests/premiumLargeSaladV3Allowlist.test.js
          git diff --cached --check
          git commit -m "Prevent duplicate Premium Large Salad expansion"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Validate diagnostics syntax
        run: |
          node -c src/services/installFlutterMealPlannerCatalogExpansion.js
          node -c tests/premiumLargeSaladPublishedCatalogDiagnostics.test.js
          node -c tests/premiumLargeSaladV3Allowlist.test.js

      - name: Trace published catalog wrapper stages
        run: |
          set -o pipefail
          node tests/premiumLargeSaladPublishedCatalogDiagnostics.test.js 2>&1 | tee premium-large-salad-diagnostics.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-large-salad-published-catalog-diagnostics
          path: premium-large-salad-diagnostics.log
          if-no-files-found: error
          retention-days: 3

      - name: Verify Premium Large Salad allowlist
        run: NODE_ENV=test node tests/premiumLargeSaladV3Allowlist.test.js

      - name: Verify Flutter catalog expansion
        run: NODE_ENV=test node tests/flutterMealPlannerCatalogExpansion.test.js

      - name: Verify Premium Large Salad hydration contract
        run: NODE_ENV=test node tests/flutterPremiumLargeSaladOptionGroups.test.js
