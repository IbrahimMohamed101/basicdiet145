name: Landing page build
on:
  pull_request:
    branches: [landing-page-research]
    paths:
      - "landing-page/site/**"
      - ".github/workflows/landing-site-check.yml"
  push:
    branches: [landing-page-research]
    paths:
      - "landing-page/site/**"
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing-page/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
