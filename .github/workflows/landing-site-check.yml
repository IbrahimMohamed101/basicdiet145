name: Landing page build
on:
  pull_request:
    branches: [landing-page-research]
    paths:
      - "landing-page/site/**"
      - ".github/workflows/landing-site-check.yml"
  push:
    branches: [landing-page-research]
    paths:
      - "landing-page/site/**"
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing-page/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser QA for lead capture
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/landing-qa.log 2>&1 &
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 1
          done
          npx playwright test tests/lead-flow.spec.ts || { cat /tmp/landing-qa.log; exit 1; }
