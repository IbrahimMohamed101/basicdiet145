name: Debug Flutter Card Policy

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run Flutter card policy with captured diagnostics
        shell: bash
        run: |
          set +e
          NODE_ENV=test node tests/dashboardMealPlannerFlutterCardPolicy.test.js > flutter-card-policy.log 2>&1
          code=$?
          echo "$code" > flutter-card-policy.exit-code
          cat flutter-card-policy.log
          exit 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-card-policy-diagnostics
          path: |
            flutter-card-policy.log
            flutter-card-policy.exit-code
          if-no-files-found: error
