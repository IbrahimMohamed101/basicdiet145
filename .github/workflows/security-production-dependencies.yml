name: Production Dependency Security

on:
  push:
    branches:
      - feat/subscription-stacking-phase-0-1-20260806
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/security-production-dependencies.yml"
  pull_request:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/security-production-dependencies.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > production-audit.json
          audit_exit=$?
          set -e
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('production-audit.json', 'utf8'));
          const vulnerabilities = report.vulnerabilities || {};
          const rows = Object.entries(vulnerabilities)
            .map(([name, value]) => ({
              name,
              severity: String(value && value.severity || 'unknown'),
              direct: Boolean(value && value.isDirect),
              range: String(value && value.range || ''),
              fixAvailable: Boolean(value && value.fixAvailable),
            }))
            .sort((a, b) => a.severity.localeCompare(b.severity) || a.name.localeCompare(b.name));
          console.log(JSON.stringify({
            metadata: report.metadata && report.metadata.vulnerabilities || {},
            vulnerabilities: rows,
          }, null, 2));
          const blocked = rows.filter((row) => ['high', 'critical'].includes(row.severity));
          if (blocked.length) {
            console.error(`Blocked production vulnerabilities: ${blocked.map((row) => `${row.name}:${row.severity}`).join(', ')}`);
            process.exit(1);
          }
          NODE
          if [ "$audit_exit" -ne 0 ]; then
            echo "npm audit reported non-blocking production findings below high severity."
          fi
