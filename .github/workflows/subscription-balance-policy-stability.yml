name: Subscription Balance Policy Stability

on:
  push:
    branches:
      - feat/subscription-stacking-phase-0-1-20260806
    paths:
      - "tests/subscriptionBalancePolicy.test.js"
      - "tests/helpers/temporaryEnvironment.js"
      - "tests/helpers/mongoCatalogStability.js"
      - "src/services/subscription/subscriptionFreezeClientService.js"
      - "src/services/mongoTransactionRetryService.js"
      - ".github/workflows/subscription-balance-policy-stability.yml"
  pull_request:
    branches:
      - main
    paths:
      - "tests/subscriptionBalancePolicy.test.js"
      - "tests/helpers/temporaryEnvironment.js"
      - "tests/helpers/mongoCatalogStability.js"
      - "src/services/subscription/subscriptionFreezeClientService.js"
      - "src/services/mongoTransactionRetryService.js"
      - ".github/workflows/subscription-balance-policy-stability.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: subscription-balance-policy-stability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repeated-balance-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run balance policy three times without retry
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Balance policy stability attempt ${attempt}/3"
            NODE_ENV=test node tests/subscriptionBalancePolicy.test.js
          done

      - name: Run complete subscription lifecycle suite without retry
        run: npm run test:subscriptions
