name: Mongoose Production Index Safety

on:
  push:
    branches:
      - feat/subscription-stacking-phase-0-1-20260806
    paths:
      - "src/db.js"
      - "src/utils/mongooseIndexRuntimePolicy.js"
      - "src/models/Order.js"
      - "src/models/User.js"
      - "tests/mongooseIndexCompatibility.test.js"
      - "tests/mongooseProductionIndexRuntimePolicy.test.js"
      - ".github/workflows/mongoose-production-index-safety.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/db.js"
      - "src/utils/mongooseIndexRuntimePolicy.js"
      - "src/models/Order.js"
      - "src/models/User.js"
      - "tests/mongooseIndexCompatibility.test.js"
      - "tests/mongooseProductionIndexRuntimePolicy.test.js"
      - ".github/workflows/mongoose-production-index-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-index-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate schema index definitions
        run: NODE_ENV=test node tests/mongooseIndexCompatibility.test.js

      - name: Validate production auto-index hard block
        run: NODE_ENV=test node tests/mongooseProductionIndexRuntimePolicy.test.js

      - name: Subscription lifecycle regression
        run: npm run test:subscriptions
